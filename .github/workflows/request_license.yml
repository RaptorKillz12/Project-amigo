name: 1. Generate Free Unity License File
on:
  workflow_dispatch: # Tap to trigger from your mobile browser

jobs:
  get_alf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Uses the correct unityci namespace and image naming convention
      - name: Create Manual Activation Request
        run: |
          mkdir -p unity_request
          chmod 777 unity_request
          docker run --rm --user root \
            -v ${{ github.workspace }}/unity_request:/root/unity_request \
            unityci/editor:ubuntu-2021.3.8f1-base-3 \
            unity-editor -batchmode -createManualActivationFile -logfile /dev/stdout
          
          # Isolate the generated license request file 
          mv unity_request/*.alf unity_request/Unity_v2021.3.8f1.alf || true

      # Expose the .alf file right to your phone's browser as a zip download
      - name: Upload License Request Token
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2021.3.8f1.alf
          path: unity_request/Unity_v2021.3.8f1.alf
