name: 1. Generate Free Unity License File
on:
  workflow_dispatch: # Tap to trigger from your mobile browser

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      # Request manual activation file using the correct version tag
      - name: Request Activation File
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2021.3.8f1

      # Upload the generated .alf file safely as a zip artifact
      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2021.3.8f1.alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
