name: 1. Generate Free Unity License File
on:
  workflow_dispatch: # Tap to trigger from your mobile browser

jobs:
  get_alf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Uses || true to prevent Unity's expected exit code 1 from stopping the pipeline
      # Added -nographics to make the headless dump run much faster
      - name: Create Manual Activation Request
        run: |
          mkdir -p unity_request
          chmod 777 unity_request
          docker run --rm --user root \
            -v ${{ github.workspace }}/unity_request:/root/unity_request \
            unityci/editor:ubuntu-2021.3.8f1-base-3 \
            unity-editor -batchmode -nographics -quit -logfile /dev/stdout -createManualActivationFile || true
          
          # Safely extract and rename the newly dumped file
          mv unity_request/*.alf unity_request/Unity_v2021.3.8f1.alf || true

      # Expose the file to your mobile browser as a zip artifact
      - name: Upload License Request Token
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2021.3.8f1.alf
          path: unity_request/Unity_v2021.3.8f1.alf
