
name: Inspect Samba de Amigo iOS Executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4

      - name: Inspect executable
        shell: bash
        run: |
          set -eu

          mkdir -p report
          TARGET="$(find . -type f -name 'SambadeAmigo' -print -quit)"

          if [ -z "$TARGET" ]; then
            echo "ERROR: SambadeAmigo was not found in the repository."
            exit 1
          fi

          {
            echo "Samba de Amigo: Party-To-Go"
            echo "Inspection date: $(date -u)"
            echo "File path: $TARGET"
            echo
            echo "File size:"
            stat -c '%s bytes' "$TARGET"
            echo
            echo "File format and architecture:"
            file "$TARGET"
            echo
            echo "SHA-256:"
            sha256sum "$TARGET"
            echo
            echo "First 32 bytes (hex):"
            od -An -tx1 -N32 "$TARGET"
          } | tee report/executable-report.txt

      - name: Upload text report
        uses: actions/upload-artifact@v4
        with:
          name: sambadeamigo-executable-report
          path: report/executable-report.txt
          retention-days: 3
